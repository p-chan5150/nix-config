# font_family      0xProtoNerdFont
# bold_font        auto
# italic_font      auto
# bold_italic_font auto

font_size 13

# Map Ctrl + Backspace to delete the previous word
map ctrl+backspace send_text all \x17

# Map Ctrl + Delete to delete the next word
map ctrl+delete send_text all \x1b[3;5~\x08

map ctrl+l send_text all \x1b[C

# map ctrl+j send_text all \x1b[B

# map ctrl+k send_text all \x1b[A

map ctrl+h send_text all \x1b[D




# BEGIN_KITTY_FONTS
font_family      family="GoogleSansCode Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
include themes/noctalia.conf
